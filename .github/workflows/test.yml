# Org policy allows only actions owned by czyrustuazon — no actions/checkout or
# actions/setup-python. Clone with plain git + GITHUB_TOKEN instead.
# ubuntu-latest ships Python 3.12+.
#
# Runs on main merges and PRs targeting main only (not Bleeding-Edge pushes).

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Fresh clone into workspace (runner starts empty without actions/checkout).
          rm -rf "${GITHUB_WORKSPACE:?}/.git" "${GITHUB_WORKSPACE}"/* "${GITHUB_WORKSPACE}"/.[!.]* 2>/dev/null || true
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # PR merge commit (base + head) — same as default actions/checkout behavior.
            git fetch --no-tags --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/pr"
            git checkout --force -B ci "refs/remotes/origin/pr"
          else
            git fetch --no-tags --depth=1 origin "+${GITHUB_SHA}:refs/remotes/origin/sha"
            git checkout --force -B ci "refs/remotes/origin/sha"
          fi
          test -f dev/requirements-dev.txt
          echo "Checked out $(git rev-parse --short HEAD)"
          ls -la dev/requirements-dev.txt dev/requirements.txt tests | head -n 40

      - name: Verify Python
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip --version

      - name: Install dev dependencies
        run: python3 -m pip install -r dev/requirements-dev.txt

      # Hard errors only: syntax errors, undefined names, bad comparisons.
      # Catches crashes in scripts that have no test of their own.
      - name: Lint (ruff hard errors)
        run: python3 -m ruff check --select E9,F63,F7,F82 src tools tests

      # Coverage counts only tests that run everywhere (not local_data), so the
      # floors in tests/snapshots/coverage_floor.json mean the same here and locally.
      - name: Run unit tests (with coverage)
        run: python3 -m coverage run -m pytest tests/ -v -rs -m "not local_data"

      # -rs lists skips: vanilla-backed checks (test_code_patch_map) skip here
      # and run locally / in the pre-push hook instead.
      - name: Run local-data tests (skip without vanilla dumps)
        run: python3 -m pytest tests/ -v -rs -m local_data

      - name: Coverage report
        run: python3 -m coverage report --skip-covered --sort=cover

      # Ratchet toward 100%: no file may drop below its floor; new files need 100%.
      - name: Coverage ratchet
        run: python3 dev/check_coverage.py
