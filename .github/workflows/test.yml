# Org policy allows only actions owned by czyrustuazon — no actions/checkout or
# actions/setup-python. push/pull_request jobs already have the repo in
# GITHUB_WORKSPACE; ubuntu-latest ships Python 3.12+.
#
# Runs on main merges and PRs targeting main only (not Bleeding-Edge pushes).

name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Python
        run: |
          set -euo pipefail
          python3 --version
          python3 -m pip --version

      - name: Install dev dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python3 -m pytest tests/ -v
