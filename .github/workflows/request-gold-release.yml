# Push to main (EngPatcher) → ping nlpp-gold-maker to bake + publish Releases.
# Other branches do not trigger this.
#
# Once: EngPatcher secret NLPP_GOLD_DISPATCH_TOKEN = PAT that can
#   POST /repos/OWNER/nlpp-gold-maker/dispatches
# Optional var: NLPP_GOLD_REPO=OWNER/nlpp-gold-maker
#   (default: <owner>/nlpp-gold-maker — not the old <owner>/nlpp-gold slug)
#
# Rolling Release tag on nlpp-gold-maker: "gold" (assets overwritten each run).
# Consumers: python tools/fetch_release_bake.py --repo OWNER/nlpp-gold-maker --tag gold

name: Request gold Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_pack:
        description: "Ask nlpp-gold-maker to skip PNG pack (TRB/deploys only)"
        type: boolean
        default: false
      engpatcher_ref:
        description: "EngPatcher ref/SHA to build (default: this SHA / main)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Manual runs only for repo owner; push-to-main still triggers for merges.
    if: github.event_name != 'workflow_dispatch' || github.actor == 'czyrustuazon'
    steps:
      - name: Resolve payload
        id: meta
        run: |
          set -euo pipefail
          # Always publish to the rolling "gold" Release on nlpp-gold-maker.
          TAG=gold

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.engpatcher_ref }}" ]; then
            REF="${{ inputs.engpatcher_ref }}"
          else
            REF="${{ github.sha }}"
          fi

          SKIP=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_pack }}" = "true" ]; then
            SKIP=true
          fi

          GOLD="${{ vars.NLPP_GOLD_REPO }}"
          if [ -z "$GOLD" ]; then
            GOLD="${{ github.repository_owner }}/nlpp-gold-maker"
          fi
          # Retired GitHub slug (repo is nlpp-gold-maker). Catch a leftover
          # Actions var NLPP_GOLD_REPO=OWNER/nlpp-gold so dispatch is not 404.
          case "$GOLD" in
            */nlpp-gold)
              GOLD="${GOLD%/nlpp-gold}/nlpp-gold-maker"
              echo "Remapped retired nlpp-gold slug → $GOLD"
              ;;
          esac

          {
            echo "tag=$TAG"
            echo "ref=$REF"
            echo "skip_pack=$SKIP"
            echo "gold_repo=$GOLD"
          } >> "$GITHUB_OUTPUT"
          echo "Dispatch → $GOLD  release_tag=$TAG  engpatcher_ref=$REF  skip_pack=$SKIP"

      - name: repository_dispatch → nlpp-gold-maker
        env:
          GH_TOKEN: ${{ secrets.NLPP_GOLD_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "Missing EngPatcher secret NLPP_GOLD_DISPATCH_TOKEN" >&2
            exit 1
          fi
          GOLD="${{ steps.meta.outputs.gold_repo }}"
          BODY=$(jq -n \
            --arg tag "${{ steps.meta.outputs.tag }}" \
            --arg ref "${{ steps.meta.outputs.ref }}" \
            --arg skip "${{ steps.meta.outputs.skip_pack }}" \
            --arg sha "${{ github.sha }}" \
            --arg repo "${{ github.repository }}" \
            '{
              event_type: "engpatcher-release",
              client_payload: {
                tag: $tag,
                engpatcher_ref: $ref,
                skip_pack: ($skip == "true"),
                source_sha: $sha,
                source_repo: $repo
              }
            }')
          if ! gh api --method POST "repos/${GOLD}/dispatches" --input - <<<"$BODY"; then
            echo "repository_dispatch failed for ${GOLD}." >&2
            echo "Bake repo must be OWNER/nlpp-gold-maker (not the retired nlpp-gold slug)." >&2
            echo "Fix: EngPatcher variable NLPP_GOLD_REPO=OWNER/nlpp-gold-maker" >&2
            echo "and secret NLPP_GOLD_DISPATCH_TOKEN = PAT with repo access to that private repo." >&2
            echo "Workaround: run Actions → Release gold bake on nlpp-gold-maker directly." >&2
            exit 1
          fi
          echo "Pinged ${GOLD}. Watch nlpp-gold-maker Actions → Release gold bake."
